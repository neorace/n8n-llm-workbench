<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Workbench</title>
    <link rel="stylesheet" href="/styles.css?v=20260730-prmt1-create" />
  </head>
  <body>
    <div id="root">
      <p class="boot-status">Loading, please wait...</p>
    </div>
    <script>
      window.__MRS_BOOT = { scriptError: "", startedAt: Date.now() };
      function showBootFailure(detail) {
        var root = document.getElementById("root");
        if (!root || root.querySelector(".layout")) return;
        root.innerHTML =
          '<div style="padding:24px;color:#f87171;font:14px/1.5 Arial,sans-serif;">' +
          "<strong>Failed to load the application.</strong><br>" +
          (detail || "Open the browser developer tools (F12) and check Network/Console for <code>/app.js</code> errors.") +
          "<br><br><span style=\"color:#9ca3af;font-size:12px;\">" +
          "If deploying from a JAR, verify <code>BOOT-INF/classes/static/app.js</code> is present inside the package." +
          "</span></div>";
      }
      window.addEventListener("error", function (event) {
        if (event && event.filename && String(event.filename).indexOf("/app.js") >= 0) {
          window.__MRS_BOOT.scriptError = event.message || "app.js load error";
          showBootFailure(
            "<code>/app.js</code> failed to run: " +
              String(window.__MRS_BOOT.scriptError)
          );
        }
      });
    </script>
    <script
      type="module"
      src="/app.js?v=20260730-prmt1-create"
      onerror='showBootFailure("<code>/app.js</code> could not be loaded. (404 or network error)<br>Ensure static/app.js is packaged in the JAR.")'
    ></script>
    <script>
      window.setTimeout(function () {
        var root = document.getElementById("root");
        if (!root || root.querySelector(".layout")) return;
        if (window.__MRS_BOOT.scriptError) return;
        showBootFailure(
          "<code>/app.js</code> did not finish loading in time.<br>" +
            "Please refresh the browser cache or verify the packaged static files."
        );
      }, 30000);
    </script>
  </body>
</html>
